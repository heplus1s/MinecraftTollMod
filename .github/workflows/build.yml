name: Build toll mod
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and run unit tests
        run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: tollmod-jars
          path: build/libs/*.jar

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tollmod-jars
          path: release-jars
      - name: Publish versioned release without replacing an existing version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.1 >/dev/null 2>&1; then
            echo "Release v1.0.1 already exists; refusing to replace it."
            exit 1
          fi
          if gh api repos/heplus1s/MinecraftTollMod/git/ref/tags/v1.0.1 >/dev/null 2>&1; then
            echo "Tag v1.0.1 already exists; refusing to move it."
            exit 1
          fi
          gh release view v1.0.17 --repo heplus1s/MinecraftBankMod >/dev/null
          gh release create v1.0.1 release-jars/tollmod-1.0.1.jar --target "$GITHUB_SHA" --title "v1.0.1 显示收费主体" --notes-file RELEASE_NOTES_1.0.1.md
